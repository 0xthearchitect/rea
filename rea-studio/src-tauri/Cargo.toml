[package]
name = "rea-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Independent local graphical workspace for REA"

[features]
e2e = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"
